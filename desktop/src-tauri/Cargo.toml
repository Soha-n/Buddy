[package]
name = "buddy-desktop"
version = "1.0.0"
description = "Buddy - local AI chat"
authors = ["Buddy"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Tauri's own default; keeps `cargo build` honest outside `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The shell is a thin wrapper, so favour size over build time: this trims a
# few MB from an installer that already has a large payload to download.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
