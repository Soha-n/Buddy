[package]
name = "buddy-desktop"
version = "1.0.0"
description = "Buddy - local AI chat"
authors = ["Buddy"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Job objects: the only way to guarantee the backend dies with this process
# even when this process is killed outright. See attach_to_job in main.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # CreateJobObjectW takes a SECURITY_ATTRIBUTES pointer, so it is gated
    # behind this feature even though we pass null.
    "Win32_Security",
] }

[features]
# Tauri's own default; keeps `cargo build` honest outside `tauri build`.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# The shell is a thin wrapper, so favour size over build time: this trims a
# few MB from an installer that already has a large payload to download.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
